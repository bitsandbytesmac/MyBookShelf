<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password · MyBookShelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth">
        <div class="auth-card card">
            <a href="/" class="brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
                </span>
                MyBookShelf
            </a>

            <div id="requestStep">
                <h1>Forgot your password?</h1>
                <p class="lead">Enter the email you signed up with and we'll send you a link to choose a new one.</p>

                <form id="forgotForm" novalidate>
                    <div class="field">
                        <label for="email">Email</label>
                        <input class="input" type="email" id="email" autocomplete="email" required>
                    </div>
                    <p class="form-error" id="formError" aria-live="polite"></p>
                    <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
                </form>
            </div>

            <div id="sentStep" class="hidden" role="status">
                <div class="auth-icon" aria-hidden="true">✉️</div>
                <h1>Check your email</h1>
                <p class="lead" id="sentMessage"></p>
                <p class="auth-hint">The link expires in 1 hour. Don't see it? Check your spam folder, or
                    <button type="button" class="link-btn" id="tryAgain">try again</button>.</p>
            </div>

            <p class="auth-alt"><a href="login.html">Back to log in</a></p>
        </div>
    </main>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
