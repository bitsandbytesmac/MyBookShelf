<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account · MyBookShelf</title>
    <script>
        if (localStorage.getItem("token")) location.replace("/");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="js/theme-boot.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth">
        <div class="auth-card card">
            <a href="/" class="brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
                </span>
                MyBookShelf
            </a>

            <h1>Create your shelf</h1>
            <p class="lead">Track what you read, what you're reading, and what's next.</p>

            <form id="registerForm" novalidate>
                <div class="field">
                    <label for="username">Name</label>
                    <input class="input" id="username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input class="input" type="email" id="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input class="input" type="password" id="password" autocomplete="new-password" minlength="8" required>
                    <span class="hint">At least 8 characters.</span>
                </div>
                <p class="form-error" id="formError" aria-live="polite"></p>
                <button type="submit" class="btn btn-primary btn-block">Create account</button>
                <p class="auth-legal">By creating an account, you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</p>
            </form>

            <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </main>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
