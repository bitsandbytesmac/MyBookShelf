<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The URL carries a reset token: never send it to other sites (e.g. the font CDN). -->
    <meta name="referrer" content="no-referrer">
    <title>Choose a new password · MyBookShelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="js/theme-boot.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth">
        <div class="auth-card card">
            <a href="/" class="brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
                </span>
                MyBookShelf
            </a>

            <div id="resetStep">
                <h1>Choose a new password</h1>
                <p class="lead">Make it at least 8 characters.</p>

                <form id="resetForm" novalidate>
                    <div class="field">
                        <label for="password">New password</label>
                        <input class="input" type="password" id="password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <div class="field">
                        <label for="confirmPassword">Confirm new password</label>
                        <input class="input" type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
                    </div>
                    <p class="form-error" id="formError" aria-live="polite"></p>
                    <button type="submit" class="btn btn-primary btn-block">Update password</button>
                </form>
            </div>

            <div id="invalidStep" class="hidden" role="alert">
                <h1>Link not valid</h1>
                <p class="lead" id="invalidMessage">This reset link is missing or incomplete.</p>
                <a class="btn btn-primary btn-block" href="forgot-password.html">Request a new link</a>
            </div>

            <p class="auth-alt"><a href="login.html">Back to log in</a></p>
        </div>
        <p class="auth-legal"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
    </main>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
