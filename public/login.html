<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · MyBookShelf</title>
    <script>
        if (localStorage.getItem("token")) location.replace("/");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth">
        <div class="auth-card card">
            <a href="/" class="brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
                </span>
                MyBookShelf
            </a>

            <h1>Welcome back</h1>
            <p class="lead">Log in to pick up where you left off.</p>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input class="input" type="email" id="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="forgot-password.html" id="forgotLink">Forgot password?</a>
                    </div>
                    <input class="input" type="password" id="password" autocomplete="current-password" required>
                </div>
                <p class="form-notice" id="formNotice" aria-live="polite"></p>
                <p class="form-error" id="formError" aria-live="polite"></p>
                <button type="submit" class="btn btn-primary btn-block">Log in</button>
            </form>

            <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>
        </div>
    </main>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
