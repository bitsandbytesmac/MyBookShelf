<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A personal reading journal: your shelf, your progress, your favourite lines.">
    <meta name="theme-color" content="#FFF9D6">
    <title>MyBookShelf</title>

    <script>
        if (!localStorage.getItem("token")) location.replace("/login.html");
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="js/theme-boot.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topnav">
        <div class="topnav-inner">
            <a href="#/dashboard" class="brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
                </span>
                MyBookShelf
            </a>

            <nav class="tabs" aria-label="Main">
                <a href="#/dashboard" class="tab" data-route="dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
                    Dashboard
                </a>
                <a href="#/library" class="tab" data-route="library">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4z"/><path d="m16.5 4.5 3.8-1 3.7 15.5-3.8 1z"/></svg>
                    Library
                </a>
            </nav>

            <div class="nav-actions">
                <button type="button" class="btn btn-primary" data-action="add-book" aria-label="Add a book">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    <span class="label">Add book</span>
                </button>

                <div class="menu">
                    <button type="button" class="avatar-btn" id="avatarBtn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu"></button>
                    <div class="menu-panel hidden" id="menuPanel" role="menu">
                        <div class="menu-head">
                            <strong id="menuName"></strong>
                            <span id="menuEmail"></span>
                        </div>
                        <button type="button" class="menu-item" id="customizeBtn" role="menuitem">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16a6 6 0 0 0 6-6c0-4.4-4.5-8.6-10-8.6z"/></svg>
                            Customize look
                        </button>
                        <div class="menu-sep" role="separator"></div>
                        <a href="privacy.html" class="menu-item" role="menuitem">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                            Privacy policy
                        </a>
                        <a href="terms.html" class="menu-item" role="menuitem">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
                            Terms &amp; conditions
                        </a>
                        <div class="menu-sep" role="separator"></div>
                        <button type="button" class="menu-item" id="logoutBtn" role="menuitem">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                            Log out
                        </button>
                        <button type="button" class="menu-item menu-item-danger" id="deleteAccountBtn" role="menuitem">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                            Delete account
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main id="view" class="page" tabindex="-1"></main>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
